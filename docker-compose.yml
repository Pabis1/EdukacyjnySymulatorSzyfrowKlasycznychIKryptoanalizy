services:
  backend:
    build:
      context: .
      dockerfile: src/edukacyjnysymulatorszyfrowklasycznychikryptoanalizy/backend/Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/caesar')"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./src/edukacyjnysymulatorszyfrowklasycznychikryptoanalizy/frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  test:
    build:
      context: .
      dockerfile: src/edukacyjnysymulatorszyfrowklasycznychikryptoanalizy/backend/Dockerfile
    command: ["pytest"]
    profiles: ["test"]
