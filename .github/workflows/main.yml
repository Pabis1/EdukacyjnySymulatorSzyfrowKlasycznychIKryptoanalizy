name: Uruchomienie testów (Docker Compose)

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Uruchomienie testów przez docker-compose
        run: |
          docker compose run --rm --build test
