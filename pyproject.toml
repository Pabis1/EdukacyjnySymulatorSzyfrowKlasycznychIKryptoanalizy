[project]
name = "edukacyjnysymulatorszyfrowklasycznychikryptoanalizy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Filip", email = "paczula.filip21@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "nltk>=3.10.3",
    "numpy>=2.5.4",
    "pydantic>=2.14",
    "pydantic-settings>=2.11",
    "streamlit>=1.65.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
edukacyjnysymulatorszyfrowklasycznychikryptoanalizy = "edukacyjnysymulatorszyfrowklasycznychikryptoanalizy:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["src/edukacyjnysymulatorszyfrowklasycznychikryptoanalizy/tests"]
pythonpath = ["src/edukacyjnysymulatorszyfrowklasycznychikryptoanalizy"]
